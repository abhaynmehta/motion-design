<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>County Group Film</title>
<style>
  /* One display face, one UI face: the site's own Playfair Display (roman + italic) and Montserrat (OFL). */
  @font-face { font-family: 'Display'; src: url(../assets/fonts/display.woff2) format('woff2'); font-weight: 400 900; font-style: normal; }
  @font-face { font-family: 'Display'; src: url(../assets/fonts/display-italic.woff2) format('woff2'); font-weight: 400 900; font-style: italic; }
  @font-face { font-family: 'UI'; src: url(../assets/fonts/ui.woff2) format('woff2'); font-weight: 100 900; }
  :root {
    /* countygroup.in tokens: ONE accent (gold) */
    --cream: #F1ECE1; --brown: #3A291C; --deep: #1C130D; --ink: #3A291C; --ink-2: #6b5847;
    --accent: #C29E63; --accent-ink: #A6834A; --on-dark: #F1ECE1;
    --bg: var(--cream);
  }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; overflow: hidden; background: var(--deep); transform-origin: 0 0;
           font-family: 'UI', 'Helvetica Neue', Arial, sans-serif; color: var(--ink);
           -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
  .scene { position: absolute; inset: 0; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .display { font-family: 'Display', Georgia, serif; font-weight: 400; letter-spacing: -0.01em; line-height: 0.95; white-space: nowrap; }
  .it { font-style: italic; }
  .caps { font-family: 'UI', Arial, sans-serif; font-weight: 500; text-transform: uppercase; line-height: 1.1; white-space: nowrap; }
  /* a line is a mask: words rise through it. Italic lines get extra side padding so swashes are not clipped. */
  .line { position: absolute; overflow: hidden; padding: 0.08em 0.04em 0.18em; margin: -0.08em -0.04em 0; white-space: nowrap; }
  .line.it { padding: 0.1em 0.14em 0.22em; margin: -0.1em -0.14em 0; }
  .word { display: inline-block; }
  .bgDark { background: radial-gradient(120% 95% at 42% 45%, #3A291C 0%, #2a1d13 48%, #160f0a 100%); }
  .bgWarm { background: radial-gradient(80% 85% at 70% 50%, #4a3322 0%, #2b1d13 55%, #140d08 100%); }
  .bgCream { background: radial-gradient(130% 110% at 30% 40%, #F5F1E8 0%, #F1ECE1 55%, #E8E1D2 100%); }
  .frame, .tile { position: absolute; overflow: hidden; background: #120c08; box-shadow: 0 40px 90px -30px rgba(0,0,0,.75), 0 8px 24px -8px rgba(0,0,0,.5); }
  .shot { position: absolute; inset: 0; overflow: hidden; }
  .shot img, .tile img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
  body.play { display: block; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="lib/motion.js"></script>
<script src="data.js"></script>
<script src="core.js"></script>
<script src="type.js"></script>
<script src="film.js"></script>
</body>
</html>
