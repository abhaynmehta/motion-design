<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Bummer Underrated Views</title>
<style>
  /* Bummer's wordmark is a lowercase grotesque; Archivo (OFL) carries the display, DM Mono (OFL) the place labels like a
     postcard stamp. ₹ comes from the latin-ext files. */
  @font-face { font-family: 'Display'; src: url(../assets/fonts/archivo-600-900.woff2) format('woff2'); font-weight: 600 900;
               unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212, U+FEFF; }
  @font-face { font-family: 'Display'; src: url(../assets/fonts/archivo-600-900-ext.woff2) format('woff2'); font-weight: 600 900; unicode-range: U+0100-02BA, U+20A0-20AB, U+20AD-20C4; }
  @font-face { font-family: 'Mono'; src: url(../assets/fonts/dm-mono-500.woff2) format('woff2'); font-weight: 500;
               unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212, U+FEFF; }
  @font-face { font-family: 'Mono'; src: url(../assets/fonts/dm-mono-500-ext.woff2) format('woff2'); font-weight: 500; unicode-range: U+0100-02BA, U+20A0-20AB, U+20AD-20C4; }
  :root {
    /* deep night-sky navy; one sky-cyan accent; white postcards */
    --navy: #0C1E4A; --cyan: #58C7FF; --ink: #FFFFFF; --bg: var(--navy);
  }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; overflow: hidden; background: var(--bg); transform-origin: 0 0; color: var(--ink);
           font-family: 'Display', 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
  .scene { position: absolute; inset: 0; overflow: hidden; }
  body.play { display: block; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="lib/motion.js"></script>
<script src="data.js"></script>
<script src="core.js"></script>
<script src="type.js"></script>
<script src="film.js"></script>
</body>
</html>
