<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>rhode Lip Day</title>
<style>
  /* rhodeskin.com sets headlines in Rektorat Heavy and everything else in Swiss (both licensed to their site), so the film
     uses the closest open faces: Russo One (OFL) for Rektorat, Inter (OFL) for Swiss. Both from Google Fonts. */
  @font-face { font-family: 'Display'; src: url(../assets/fonts/russo-one-400.woff2) format('woff2'); font-weight: 400; }
  @font-face { font-family: 'UI'; src: url(../assets/fonts/inter-100-900.woff2) format('woff2'); font-weight: 100 900; }
  :root {
    /* measured on rhodeskin.com: panel #F1F0ED, ink #67645E (warm grey, all type and the logo), grey #84827E,
       terracotta #BB7055 (the one accent) */
    --panel: #F1F0ED; --ink: #67645E; --grey: #84827E; --accent: #BB7055; --bg: var(--panel);
  }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; overflow: hidden; background: var(--panel); transform-origin: 0 0; color: var(--ink);
           font-family: 'UI', 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
  .scene { position: absolute; inset: 0; overflow: hidden; }
  .display { font-family: 'Display', 'Helvetica Neue', Arial, sans-serif; font-weight: 400; letter-spacing: -0.01em; line-height: 1.0; white-space: nowrap; }
  .ui { font-family: 'UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; letter-spacing: 0; line-height: 1.15; white-space: nowrap; }
  .caps { text-transform: uppercase; letter-spacing: 0.12em; font-weight: 600; }
  .bold { font-weight: 700; }
  .it { font-style: italic; }
  .tab { font-variant-numeric: tabular-nums; }
  .line { position: absolute; overflow: hidden; padding: 0.1em 0.05em 0.2em; margin: -0.1em -0.05em 0; white-space: nowrap; }
  .word { display: inline-block; }
  .kbox { position: absolute; font-family: 'Display', 'Helvetica Neue', Arial, sans-serif; line-height: 1; white-space: nowrap; transform-origin: 50% 85%; }
  .kl { display: inline-block; transform-origin: 50% 85%; }
  .fill { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  body.play { display: block; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="lib/motion.js"></script>
<script src="data.js"></script>
<script src="core.js"></script>
<script src="type.js"></script>
<script src="shots.js"></script>
<script src="footage.js"></script>
<script src="film.js"></script>
</body>
</html>
