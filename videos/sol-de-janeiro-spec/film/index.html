<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sol de Janeiro Departures</title>
<style>
  /* soldejaneiro.com sets headlines in Knockout (Hoefler & Co, licensed to their site) and body copy in Noto Sans. The film
     uses Oswald (OFL), an open condensed gothic, for Knockout, and the site's own Noto Sans (OFL). */
  @font-face { font-family: 'Display'; src: url(../assets/fonts/oswald-200-700.woff2) format('woff2'); font-weight: 200 700; }
  @font-face { font-family: 'UI'; src: url(../assets/fonts/noto-sans-600.woff2) format('woff2'); font-weight: 100 900; }
  :root {
    /* measured on soldejaneiro.com: ink #212722 (type, the board), off-white #F5F5F5, Sol yellow #FFB600 (the one accent);
       each flight's field is its bottle's colour (product colour, not UI colour) */
    --ink: #212722; --paper: #F5F5F5; --accent: #FFB600; --bg: var(--ink);
  }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; overflow: hidden; background: var(--ink); transform-origin: 0 0; color: #fff;
           font-family: 'UI', 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
  .scene { position: absolute; inset: 0; overflow: hidden; }
  .display { font-family: 'Display', 'Arial Narrow', sans-serif; font-weight: 600; letter-spacing: 0.005em; line-height: 1.0; white-space: nowrap; text-transform: uppercase; }
  .ui { font-family: 'UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; letter-spacing: 0; line-height: 1.2; white-space: nowrap; }
  .caps { text-transform: uppercase; letter-spacing: 0.14em; }
  .lower { text-transform: none; }
  .line { position: absolute; overflow: hidden; padding: 0.1em 0.05em 0.2em; margin: -0.1em -0.05em 0; white-space: nowrap; }
  .word { display: inline-block; }
  .fill { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  body.play { display: block; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="lib/motion.js"></script>
<script src="data.js"></script>
<script src="core.js"></script>
<script src="type.js"></script>
<script src="shots.js"></script>
<script src="footage.js"></script>
<script src="film.js"></script>
</body>
</html>
