<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mokobara Zero Digging</title>
<style>
  /* Mokobara sets its site in NeurialGrotesk (licensed, not used): Space Grotesk (OFL) for the display lines, Space Mono
     (OFL, the same family's mono) for the compartment labels and the 0 SEC tags, like a luggage tag. ₹ lives in the
     latin-ext files. */
  @font-face { font-family: 'Display'; src: url(../assets/fonts/space-grotesk-500-700.woff2) format('woff2'); font-weight: 300 700;
               unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212, U+FEFF; }
  @font-face { font-family: 'Display'; src: url(../assets/fonts/space-grotesk-500-700-ext.woff2) format('woff2'); font-weight: 300 700; unicode-range: U+0100-02BA, U+20A0-20AB, U+20AD-20C4; }
  @font-face { font-family: 'UI'; src: url(../assets/fonts/space-mono-700.woff2) format('woff2'); font-weight: 700;
               unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212, U+FEFF; }
  @font-face { font-family: 'UI'; src: url(../assets/fonts/space-mono-700-ext.woff2) format('woff2'); font-weight: 700; unicode-range: U+0100-02BA, U+20A0-20AB, U+20AD-20C4; }
  :root {
    /* Mokobara yellow, measured off the brand's mailer box in its own film; ink type; the hook alone is near-black */
    --yellow: #F7C443; --ink: #121110; --dark: #0F0E0D; --bg: var(--yellow);
  }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; overflow: hidden; background: var(--bg); transform-origin: 0 0; color: var(--ink);
           font-family: 'Display', 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
  .scene { position: absolute; inset: 0; overflow: hidden; }
  body.play { display: block; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="lib/motion.js"></script>
<script src="data.js"></script>
<script src="core.js"></script>
<script src="type.js"></script>
<script src="shots.js"></script>
<script src="footage.js"></script>
<script src="film.js"></script>
</body>
</html>
