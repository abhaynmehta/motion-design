<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Olaplex Humidity Match</title>
<style>
  /* olaplex.com sets everything in ABC Diatype and Diatype Semi-Mono (Dinamo, licensed to their site): the film uses
     Geist and Geist Mono (OFL), the closest open grotesk + mono pair. Both from Google Fonts. */
  @font-face { font-family: 'Display'; src: url(../assets/fonts/geist-100-900.woff2) format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'UI'; src: url(../assets/fonts/geist-mono-100-900.woff2) format('woff2'); font-weight: 100 900; }
  :root {
    /* olaplex.com: black #000 / white type; the film's ground is a warm near-black, the one accent is the oil's amber */
    --ground: #0C0B0A; --ink: #FFFFFF; --mute: #B9B2A7; --accent: #F2B33D; --bg: var(--ground);
  }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; overflow: hidden; background: var(--ground); transform-origin: 0 0; color: #fff;
           font-family: 'Display', 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
  .scene { position: absolute; inset: 0; overflow: hidden; }
  .display { font-family: 'Display', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; letter-spacing: -0.035em; line-height: 0.98; white-space: nowrap; }
  .black { font-weight: 900; letter-spacing: -0.045em; }
  .mono { font-family: 'UI', ui-monospace, monospace; font-weight: 600; letter-spacing: 0.02em; line-height: 1.1; white-space: nowrap; text-transform: uppercase; }
  .line { position: absolute; overflow: hidden; padding: 0.1em 0.05em 0.2em; margin: -0.1em -0.05em 0; white-space: nowrap; }
  .word { display: inline-block; }
  .fill { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  body.play { display: block; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="lib/motion.js"></script>
<script src="data.js"></script>
<script src="core.js"></script>
<script src="type.js"></script>
<script src="shots.js"></script>
<script src="footage.js"></script>
<script src="film.js"></script>
</body>
</html>
