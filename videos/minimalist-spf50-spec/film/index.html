<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Minimalist SPF Lab</title>
<style>
  /* beminimalist.co sets everything in Proxima Nova (licensed to their site): the film uses Montserrat (OFL), the closest
     open geometric sans, and IBM Plex Mono (OFL) for the lab readout. ₹ comes from Montserrat's latin-ext file. */
  @font-face { font-family: 'Display'; src: url(../assets/fonts/montserrat-500-900.woff2) format('woff2'); font-weight: 500 900;
               unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212, U+FEFF; }
  @font-face { font-family: 'Display'; src: url(../assets/fonts/montserrat-500-900-ext.woff2) format('woff2'); font-weight: 500 900;
               unicode-range: U+0100-02BA, U+20A0-20AB, U+20AD-20C4; }
  @font-face { font-family: 'UI'; src: url(../assets/fonts/ibm-plex-mono-500.woff2) format('woff2'); font-weight: 500; }
  @font-face { font-family: 'UI'; src: url(../assets/fonts/ibm-plex-mono-600.woff2) format('woff2'); font-weight: 600; }
  :root {
    /* Minimalist's own orange (the SPF line on the tube, measured #FB6927) as the field; black type (the brand's ink);
       the lab readout is a black instrument with white figures */
    --ground: #F96A28; --ink: #111111; --paper: #FFFFFF; --bg: var(--ground);
  }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; overflow: hidden; background: var(--ground); transform-origin: 0 0; color: var(--ink);
           font-family: 'Display', 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
  .scene { position: absolute; inset: 0; overflow: hidden; }
  .display { font-family: 'Display', sans-serif; font-weight: 800; letter-spacing: -0.035em; line-height: 0.92; white-space: nowrap; }
  .black { font-weight: 900; letter-spacing: -0.05em; }
  .mono { font-family: 'UI', ui-monospace, monospace; font-weight: 600; letter-spacing: 0.08em; line-height: 1.1; white-space: nowrap; text-transform: uppercase; }
  .line { position: absolute; overflow: hidden; padding: 0.1em 0.05em 0.18em; margin: -0.1em -0.05em 0; white-space: nowrap; }
  .word { display: inline-block; }
  .fill { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  body.play { display: block; }
</style>
</head>
<body>
<div id="stage"></div>
<script>window.MATTE_SHOTS = ['dots', 'blend', 'press'];</script>
<script src="lib/motion.js"></script>
<script src="data.js"></script>
<script src="core.js"></script>
<script src="type.js"></script>
<script src="shots.js"></script>
<script src="footage.js"></script>
<script src="film.js"></script>
</body>
</html>
