<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Glossier Ultralip Label</title>
<style>
  /* glossier.com sets everything in Apercu (Colophon, licensed to their site): the film uses Figtree (OFL), the closest
     open geometric grotesk, with its italic for the supers (the wordmark leans), and DM Mono (OFL) for the woven care
     label's small print. Both from Google Fonts. */
  @font-face { font-family: 'Display'; src: url(../assets/fonts/figtree-300-900.woff2) format('woff2'); font-weight: 300 900; font-style: normal; }
  @font-face { font-family: 'Display'; src: url(../assets/fonts/figtree-italic-300-900.woff2) format('woff2'); font-weight: 300 900; font-style: italic; }
  @font-face { font-family: 'UI'; src: url(../assets/fonts/dm-mono-500.woff2) format('woff2'); font-weight: 500; }
  :root {
    /* the ground is a deep berry knit (the darker Ultralip shades); Glossier pink is the one accent (the tube, the
       label, the tag); white type; the label's ink is a wine shade of the ground */
    --ground: #2A0A12; --ink: #FFFFFF; --wine: #4A1222; --accent: #F5D3DC; --bg: var(--ground);
  }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; overflow: hidden; background: var(--ground); transform-origin: 0 0; color: #fff;
           font-family: 'Display', 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
  .scene { position: absolute; inset: 0; overflow: hidden; }
  .display { font-family: 'Display', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; letter-spacing: -0.03em; line-height: 0.98; white-space: nowrap; }
  .it { font-style: italic; }
  .black { font-weight: 900; letter-spacing: -0.04em; }
  .mono { font-family: 'UI', ui-monospace, monospace; font-weight: 500; letter-spacing: 0.06em; line-height: 1.1; white-space: nowrap; text-transform: uppercase; }
  .line { position: absolute; overflow: hidden; padding: 0.1em 0.06em 0.2em; margin: -0.1em -0.06em 0; white-space: nowrap; }
  .word { display: inline-block; }
  .fill { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  body.play { display: block; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="lib/motion.js"></script>
<script src="data.js"></script>
<script src="core.js"></script>
<script src="type.js"></script>
<script src="shots.js"></script>
<script src="footage.js"></script>
<script src="film.js"></script>
</body>
</html>
