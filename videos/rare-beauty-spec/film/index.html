<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Rare Beauty Just a Little</title>
<style>
  /* The site's own faces (rarebeauty.com theme assets; fetched by scripts/fetch_sources.sh, never committed):
     Display = Ogg Regular · UI = Neue Haas Unica · accent = Rare Script (the brand's hand, used sparingly). */
  @font-face { font-family: 'Display'; src: url(../assets/fonts/ogg-regular-400.woff2) format('woff2'); font-weight: 400; }
  @font-face { font-family: 'UI'; src: url(../assets/fonts/neue-hass-unica-regular-400.woff2) format('woff2'); font-weight: 400; }
  @font-face { font-family: 'UI'; src: url(../assets/fonts/neue-hass-unica-medium-500.woff2) format('woff2'); font-weight: 500; }
  @font-face { font-family: 'Script'; src: url(../assets/fonts/rare-script-400.woff2) format('woff2'); font-weight: 400; }
  :root {
    /* measured on rarebeauty.com: cream #FDF6F0, ink #000914, berry #7A0036 (the wordmark) as the one accent;
       mauve #A57B80 sampled from the brand's own Find Comfort ritual film */
    --cream: #FDF6F0; --ink: #000914; --berry: #7A0036; --mauve: #A57B80; --milk: #FFF7E7;
    --accent: var(--berry); --bg: var(--cream);
  }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; overflow: hidden; background: var(--cream); transform-origin: 0 0; color: var(--ink);
           font-family: 'UI', 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
  .scene { position: absolute; inset: 0; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .display { font-family: 'Display', Georgia, serif; font-weight: 400; letter-spacing: -0.02em; line-height: 1.0; white-space: nowrap; }
  .script { font-family: 'Script', 'Display', cursive; font-weight: 400; letter-spacing: 0; line-height: 1.1; white-space: nowrap; }
  .ui { font-family: 'UI', Arial, sans-serif; font-weight: 500; line-height: 1.1; white-space: nowrap; }
  .caps { text-transform: uppercase; letter-spacing: 0.24em; }
  .line { position: absolute; overflow: hidden; padding: 0.12em 0.05em 0.24em; margin: -0.12em -0.05em 0; white-space: nowrap; }
  .word { display: inline-block; }
  .fill { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  body.play { display: block; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="lib/motion.js"></script>
<script src="data.js"></script>
<script src="core.js"></script>
<script src="type.js"></script>
<script src="shots.js"></script>
<script src="footage.js"></script>
<script src="film.js"></script>
</body>
</html>
