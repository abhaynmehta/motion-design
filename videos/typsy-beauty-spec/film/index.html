<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Typsy Dessert Menu</title>
<style>
  /* The site's own faces (typsybeauty.com: Poppins for headings, Assistant for body; both OFL, from Google Fonts).
     The ₹ sign comes from Poppins' Devanagari subset, mapped by unicode-range. */
  @font-face { font-family: 'Display'; src: url(../assets/fonts/poppins-500-devanagari.woff2) format('woff2'); font-weight: 500; unicode-range: U+20B9; }
  @font-face { font-family: 'Display'; src: url(../assets/fonts/poppins-600-devanagari.woff2) format('woff2'); font-weight: 600; unicode-range: U+20B9; }
  @font-face { font-family: 'Display'; src: url(../assets/fonts/poppins-500.woff2) format('woff2'); font-weight: 500; }
  @font-face { font-family: 'Display'; src: url(../assets/fonts/poppins-600.woff2) format('woff2'); font-weight: 600; }
  @font-face { font-family: 'Display'; src: url(../assets/fonts/poppins-600-italic.woff2) format('woff2'); font-weight: 600; font-style: italic; }
  @font-face { font-family: 'Display'; src: url(../assets/fonts/poppins-700.woff2) format('woff2'); font-weight: 700; }
  @font-face { font-family: 'UI'; src: url(../assets/fonts/assistant-700.woff2) format('woff2'); font-weight: 200 800; }
  :root {
    /* measured on typsybeauty.com: hot pink #E24298 (the accent), plum #5A034B (ink), blush #FDC7CF, paper #FFF9FE */
    --pink: #E24298; --plum: #5A034B; --blush: #FDC7CF; --paper: #FFF9FE; --accent: var(--pink); --bg: var(--paper);
  }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; overflow: hidden; background: var(--paper); transform-origin: 0 0; color: var(--plum);
           font-family: 'UI', Arial, sans-serif; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
  .scene { position: absolute; inset: 0; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .display { font-family: 'Display', Arial, sans-serif; font-weight: 600; letter-spacing: -0.03em; line-height: 1.0; white-space: nowrap; }
  .med { font-weight: 500; letter-spacing: -0.01em; }
  .it { font-style: italic; }
  .ui { font-family: 'UI', Arial, sans-serif; font-weight: 700; line-height: 1.1; white-space: nowrap; }
  .caps { text-transform: uppercase; letter-spacing: 0.18em; }
  .line { position: absolute; overflow: hidden; padding: 0.1em 0.05em 0.22em; margin: -0.1em -0.05em 0; white-space: nowrap; }
  .word { display: inline-block; }
  .fill { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  body.play { display: block; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="lib/motion.js"></script>
<script src="data.js"></script>
<script src="core.js"></script>
<script src="type.js"></script>
<script src="shots.js"></script>
<script src="footage.js"></script>
<script src="film.js"></script>
</body>
</html>
